name: Daten aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"  # alle 3 Stunden (ca. 1:17, 4:17, 7:17 … Uhr UTC) – GitHub startet oft mit Verspätung
  workflow_dispatch:        # zusätzlich per Knopf „Run workflow“ startbar

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zahlen von YouTube holen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN_MUSIC: ${{ secrets.REFRESH_TOKEN_MUSIC }}
          REFRESH_TOKEN_KIDS: ${{ secrets.REFRESH_TOKEN_KIDS }}
          REFRESH_TOKEN_SCHULE: ${{ secrets.REFRESH_TOKEN_SCHULE }}
        run: python scripts/aktualisieren.py

      - name: Neue Zahlen speichern
        run: |
          if git diff --quiet daten.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "klangwerk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.json
          git commit -m "Daten aktualisiert $(date +'%d.%m.%Y')"
          git push
